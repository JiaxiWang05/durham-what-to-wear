<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>杜伦穿搭</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#222; --muted:#777; --line:#e3e1dc; --accent:#2f6f5e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181a; --card:#222427; --ink:#eee; --muted:#9a9a9a; --line:#33363a; --accent:#6cc3a8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .muted { color:var(--muted); font-size:13px; }
  button, select, input { font: inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #weather b { font-size: 26px; }
  /* outfit preview: items stacked on a body-shaped column */
  /* head-to-toe order: accessories, jacket | top, bottoms, legwear, shoes */
  .figure { margin: 8px auto 0; width: min(300px, 100%); display:grid; gap:6px; }
  .upper { display:grid; grid-template-columns: 1fr 1fr; gap:6px; }
  .upper.single { grid-template-columns: 1fr; width:60%; justify-self:center; }
  .upper .slot { height:170px; }
  .slot { background:var(--bg); border:1px dashed var(--line); border-radius:10px; min-height:90px;
          display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
  .slot img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
  .slot span { position:absolute; bottom:2px; left:6px; font-size:11px; color:var(--muted); background:var(--card); padding:0 4px; border-radius:4px; }
  .slot.acc { height:60px; min-height:0; width:60%; justify-self:center; }
  .slot.bottom { height:170px; width:70%; justify-self:center; }
  .slot.legs { height:110px; width:50%; justify-self:center; }
  .slot.shoes { height:70px; min-height:0; width:60%; justify-self:center; }
  .tag { font-size:11px; color:var(--muted); }
  #tips { margin-top:10px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap:10px; }
  .item { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--bg); }
  .item img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
  .item .meta { padding:6px; font-size:12px; display:grid; gap:4px; }
  .item select, .item input[type=text] { width:100%; padding:3px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  .item .del { background:transparent; color:#c44; padding:0; font-size:12px; text-align:left; }
  label.up { display:inline-block; }
  label.up input { display:none; }
</style>
</head>
<body>
<main>
  <h1>杜伦今天穿什么</h1>

  <section class="card" id="weather"><span class="muted">正在获取杜伦天气…</span></section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <h2>今日推荐</h2>
      <button class="ghost" id="shuffle">换一套</button>
    </div>
    <div class="row mode" style="margin-top:8px">
      <button class="ghost" data-mode="daily">日常</button>
      <button class="ghost" data-mode="goout">Go out ✨</button>
    </div>
    <div class="figure" id="figure"></div>
    <div id="tips" class="muted"></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <h2>我的衣服库 <span class="muted" id="count"></span></h2>
      <label class="up"><input type="file" id="file" accept="image/*" multiple><button type="button" onclick="this.previousElementSibling.click()">+ 添加照片</button></label>
    </div>
    <p class="muted">标“仓库”的衣服来自 GitHub 仓库的 clothes.json（公开）。这里新加的照片只存在这个浏览器里。</p>
    <div class="grid" id="items"></div>
  </section>
</main>

<script>
const CATS = { outer:"外套", top:"上衣", dress:"连衣裙", bottom:"下装", legs:"袜子/打底", shoes:"鞋", acc:"配饰(帽/围巾/手套)" };
const WARM = ["", "1 很薄", "2 薄", "3 中等", "4 厚", "5 很厚"];
let items = [], weather = null, seed = 0;

// ---------- storage (IndexedDB, falls back to memory) ----------
let db = null;
function openDB() {
  return new Promise(res => {
    try {
      const r = indexedDB.open("durham-wardrobe", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("items", { keyPath: "id" });
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = () => res();
    } catch { res(); }
  });
}
function tx(mode) { return db.transaction("items", mode).objectStore("items"); }
function loadAll() {
  return new Promise(res => {
    if (!db) return res([]);
    try { const r = tx("readonly").getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }
    catch { res([]); }
  });
}
// colored tile for catalog items that have no photo yet
function swatch(color, name) {
  const light = /^#?(f|e|d)/i.test(color.replace("#", ""));
  const lines = name.match(/.{1,6}/g) || [""];
  const text = lines.slice(0, 3).map((l, i) => `<tspan x="100" dy="${i ? 30 : 0}">${esc(l)}</tspan>`).join("");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" rx="18" fill="${color}"/>` +
    `<text x="100" y="${100 - (Math.min(lines.length, 3) - 1) * 15}" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="sans-serif" fill="${light ? "#333" : "#fff"}">${text}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
async function loadRepo() {
  try {
    const r = await fetch("clothes.json", { cache: "no-cache" });
    if (!r.ok) return [];
    return (await r.json()).map(c => ({ ...c, id: "repo:" + (c.file || c.name),
      img: c.file ? "photos/" + c.file : swatch(c.color || "#999", c.name || ""), repo: true }));
  } catch { return []; }
}
function save(it) { if (it.repo) return; try { db && tx("readwrite").put(it); } catch {} }
function remove(id) { try { db && tx("readwrite").delete(id); } catch {} }

// ---------- photo upload (downscaled to keep storage small) ----------
function shrink(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.src = URL.createObjectURL(file);
  });
}
document.getElementById("file").onchange = async e => {
  for (const f of e.target.files) {
    const it = { id: Date.now() + Math.random().toString(36).slice(2), img: await shrink(f),
                 cat: "top", warmth: 3, waterproof: false, name: "" };
    items.push(it); save(it);
  }
  e.target.value = "";
  renderItems(); recommend();
};

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function renderItems() {
  document.getElementById("count").textContent = `(${items.length} 件)`;
  const box = document.getElementById("items");
  box.innerHTML = "";
  for (const it of items) {
    const d = document.createElement("div");
    d.className = "item";
    if (it.repo) {
      d.innerHTML = `<img src="${it.img}" alt="" loading="lazy"><div class="meta">
        <div>${esc(it.name || CATS[it.cat])}</div>
        <div class="tag">${CATS[it.cat].split("(")[0]} · 保暖 ${it.warmth}${it.waterproof ? " · 防水" : ""} · 仓库</div></div>`;
      box.appendChild(d); continue;
    }
    d.innerHTML = `<img src="${it.img}" alt="">
      <div class="meta">
        <input type="text" placeholder="名字（可选）" value="${(it.name||"").replace(/"/g,"&quot;")}">
        <select class="cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===it.cat?"selected":""}>${v}</option>`).join("")}</select>
        <select class="warm">${[1,2,3,4,5].map(w=>`<option value="${w}" ${w==it.warmth?"selected":""}>保暖 ${WARM[w]}</option>`).join("")}</select>
        <label><input type="checkbox" class="wp" ${it.waterproof?"checked":""}> 防水</label>
        <button class="del">删除</button>
      </div>`;
    const upd = () => { save(it); recommend(); };
    d.querySelector("input[type=text]").onchange = e => { it.name = e.target.value; upd(); };
    d.querySelector(".cat").onchange = e => { it.cat = e.target.value; upd(); };
    d.querySelector(".warm").onchange = e => { it.warmth = +e.target.value; upd(); };
    d.querySelector(".wp").onchange = e => { it.waterproof = e.target.checked; upd(); };
    d.querySelector(".del").onclick = () => {
      if (!confirm("删除这件衣服？")) return;
      items = items.filter(x => x.id !== it.id); remove(it.id); renderItems(); recommend();
    };
    box.appendChild(d);
  }
}

// ---------- Durham weather (Open-Meteo, no key) ----------
async function getWeather() {
  const url = "https://api.open-meteo.com/v1/forecast?latitude=54.7761&longitude=-1.5733" +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m" +
    "&hourly=apparent_temperature,precipitation_probability&timezone=Europe%2FLondon&forecast_days=1";
  const el = document.getElementById("weather");
  try {
    const d = await (await fetch(url)).json();
    const hrs = d.hourly.time.map((t,i)=>({h:+t.slice(11,13), feel:d.hourly.apparent_temperature[i], rain:d.hourly.precipitation_probability[i]}))
                 .filter(x => x.h >= 8 && x.h <= 20);
    const feelMin = Math.min(...hrs.map(x=>x.feel)), feelMax = Math.max(...hrs.map(x=>x.feel));
    const rain = Math.max(...hrs.map(x=>x.rain));
    weather = { now: d.current.temperature_2m, feelNow: d.current.apparent_temperature,
                feelMin, feelMax, rain, wind: d.current.wind_speed_10m };
    el.innerHTML = `<div class="row" style="justify-content:space-between">
        <div><b>${weather.now.toFixed(0)}°C</b> <span class="muted">体感 ${weather.feelNow.toFixed(0)}°C · 风 ${weather.wind.toFixed(0)} km/h</span></div>
        <div class="muted">白天体感 ${feelMin.toFixed(0)}~${feelMax.toFixed(0)}°C · 降水概率 ${rain}%</div></div>`;
  } catch {
    el.innerHTML = `<span class="muted">天气获取失败，先按 8°C 推荐。</span>`;
    weather = { now: 8, feelNow: 8, feelMin: 6, feelMax: 10, rain: 0, wind: 0 };
  }
  recommend();
}

// ---------- rule-based recommendation ----------
// `seed` counts shuffles; `rs` is the picker's own RNG state, re-derived from it on every recommend()
let rs = 0;
function rand(n) {
  rs = (rs + 0x6D2B79F5) | 0;
  let x = Math.imul(rs ^ (rs >>> 15), 1 | rs);
  x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
  return Math.floor((((x ^ (x >>> 14)) >>> 0) / 4294967296) * n);
}
// "go out" mode: cute pieces, dressed for a ~15°C indoor venue; the coat still follows the real weather
let mode = "daily";
try { mode = localStorage.getItem("mode") === "goout" ? "goout" : "daily"; } catch {}
function pick(cat, target, preferWP, cute) {
  let pool = items.filter(i => i.cat === cat);
  if (cute && pool.some(i => i.cute)) pool = pool.filter(i => i.cute);
  if (!pool.length) return null;
  const score = i => Math.abs(i.warmth - target) + (preferWP && !i.waterproof ? 1.5 : 0);
  const best = Math.min(...pool.map(score));
  const close = pool.filter(i => score(i) <= best + 0.5);
  return close[rand(close.length)];
}
function recommend() {
  if (!weather) return;
  rs = Math.imul(seed + 1, 2654435761);
  const t = (weather.feelMin + weather.feelMax) / 2, wet = weather.rain >= 40;
  // target warmth per layer, by average daytime feels-like temperature
  let outer, top, bottom, needOuter = true, needAcc = false;
  if (t < 0)       { outer = 5; top = 4; bottom = 4; needAcc = true; }
  else if (t < 6)  { outer = t < 3 ? 5 : 4; top = 3; bottom = 3; needAcc = t < 3; }
  else if (t < 12) { outer = 3; top = 3; bottom = 3; }
  else if (t < 17) { outer = 2; top = 2; bottom = 2; }
  else             { needOuter = wet; outer = 1; top = 1; bottom = 1; }

  const goOut = mode === "goout";
  if (goOut) { top = 2; bottom = 2; }   // inner layers for ~15°C indoors
  // dress day: every other shuffle when dresses exist (2 in 3 when going out), or always if there are no bottoms
  const hasDress = items.some(i => i.cat === "dress"), hasBottom = items.some(i => i.cat === "bottom");
  const dressDay = hasDress && (!hasBottom || (goOut ? seed % 3 !== 0 : seed % 2 === 1));
  const look = {
    acc: needAcc ? pick("acc", 4) : null,
    outer: needOuter ? pick("outer", outer, wet) : null,
    top: dressDay ? pick("dress", Math.min(top, bottom), false, goOut) : pick("top", top, false, goOut),
    bottom: dressDay ? null : pick("bottom", bottom, false, goOut),
    shoes: pick("shoes", goOut ? 2 : 3, wet, goOut)
  };
  // tights only go under skirts and dresses, not trousers
  const skirt = dressDay || /裙|skirt/i.test(look.bottom?.name || "");
  look.legs = skirt && t < 15 ? pick("legs", 3) : null;
  const fig = document.getElementById("figure");
  const slot = k => {
    const it = look[k], label = (k === "top" && dressDay ? "连衣裙" : CATS[k]).split("(")[0];
    return `<div class="slot ${k}">${it ? `<img src="${it.img}" alt="">` : ""}<span>${it ? esc(it.name || label) : "没有" + label}</span></div>`;
  };
  // optional layers are left out when not needed or not owned; core pieces show "没有X" when missing
  const upper = (needOuter ? slot("outer") : "") + slot("top");
  fig.innerHTML = (look.acc ? slot("acc") : "") +
    `<div class="upper${needOuter ? "" : " single"}">${upper}</div>` +
    (dressDay ? "" : slot("bottom")) + (look.legs ? slot("legs") : "") + slot("shoes");

  const tips = [];
  if (goOut) tips.push("Go out：里面按室内 15°C 搭配，外面" + (needOuter ? "穿上外套。" : "不用外套。"));
  if (dressDay && t < 10) tips.push("穿裙子记得加厚连裤袜。");
  if (!items.length) tips.push("先在下面上传你的衣服照片。");
  tips.push(`白天平均体感约 ${t.toFixed(0)}°C。`);
  if (t < 3) tips.push("很冷，记得围巾手套。");
  if (wet) tips.push(`降水概率 ${weather.rain}%，穿防水外套/鞋或带伞。`);
  if (weather.feelMax - weather.feelMin > 6) tips.push("早晚温差大，选能脱的外套。");
  document.getElementById("tips").textContent = tips.join(" ");
}
document.getElementById("shuffle").onclick = () => { seed++; recommend(); };
function setMode(m) {
  mode = m;
  try { localStorage.setItem("mode", m); } catch {}
  document.querySelectorAll(".mode button").forEach(b => {
    const on = b.dataset.mode === m;
    b.style.background = on ? "var(--accent)" : "transparent";
    b.style.color = on ? "#fff" : "var(--accent)";
  });
  recommend();
}
document.querySelectorAll(".mode button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
setMode(mode);

(async () => { await openDB(); items = [...await loadRepo(), ...await loadAll()]; seed = new Date().getDate(); renderItems(); getWeather(); })();
</script>
</body>
</html>
